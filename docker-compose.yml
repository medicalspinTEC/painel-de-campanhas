services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campanhas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campanhas}
      POSTGRES_DB: ${POSTGRES_DB:-campanhas}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campanhas} -d ${POSTGRES_DB:-campanhas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda `prisma migrate deploy` uma vez e encerra. A app só sobe depois.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://campanhas:campanhas@db:5432/campanhas?schema=public}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      # Fuso fixo do Brasil para datas/horários e agendamento de disparos.
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_URL: ${DATABASE_URL:-postgresql://campanhas:campanhas@db:5432/campanhas?schema=public}
      # Integrações externas (opcionais — têm defaults no código).
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      N8N_DISPAROS_WEBHOOK_URL: ${N8N_DISPAROS_WEBHOOK_URL:-}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      # Endereço público do app (ex.: https://painel.seudominio.com). Usado para o webhook automático da Evolution.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Mensagens de voz do chat: ficam nesta pasta (não no banco) e são apagadas após N dias.
      AUDIO_STORAGE_DIR: ${AUDIO_STORAGE_DIR:-/app/data/audios}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-30}
    volumes:
      - audio_data:/app/data/audios
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
  audio_data:
